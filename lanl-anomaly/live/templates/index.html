<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANL Anomaly Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-logo">LANL Anomaly</div>
            <a href="/analyst" class="sidebar-item" data-page="dashboard" onclick="location.hash='#/dashboard';return false">
                <span>&#9673;</span> Live Monitoring
            </a>
            <a href="/analyst/dataset" class="sidebar-item">
                <span>&#9632;</span> Dataset Analysis
            </a>
            <div class="sidebar-divider"></div>
            <a href="#/alerts" class="sidebar-item" data-page="alerts">
                <span>&#9889;</span> Alerts
            </a>
            <a href="#/users" class="sidebar-item" data-page="users">
                <span>&#9673;</span> Users
            </a>
            <a href="#/settings" class="sidebar-item" data-page="settings">
                <span>&#9881;</span> Settings
            </a>
            <div class="sidebar-spacer"></div>
            <button class="theme-btn" id="theme-toggle">&#9681;</button>
        </nav>

        <!-- Main -->
        <div class="main-area">
            <header class="topbar">
                <div class="topbar-left">
                    <span class="topbar-title" id="topbar-title">Live Anomaly Monitor</span>
                </div>
                <div class="topbar-right">
                    <div class="flex-center gap-1">
                        <div class="health-dot" id="health-dot"></div>
                        <span class="text-10 text-faint uppercase tracking-widest" id="health-label">connected</span>
                    </div>
                    <a href="/logout" class="text-10 text-faint uppercase tracking-widest" style="cursor:pointer">Logout</a>
                </div>
            </header>

            <div class="content" id="main-content">
                <!-- SPA content renders here -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/charts.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
