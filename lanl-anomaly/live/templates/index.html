<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="/static/vendor/jetbrains-mono.css" rel="stylesheet">

    <a class="skip-link" href="#main-content">Skip to main content</a>
